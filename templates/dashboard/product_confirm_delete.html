{% extends 'base.html' %}

{% block title %}Delete {{ product.title }} — LocalHer{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="lh-card p-4 text-center">
                <i class="fa-solid fa-triangle-exclamation text-danger fs-1 mb-3"></i>
                <h4 class="fw-bold mb-2">Delete Product Listing?</h4>
                <p class="text-muted small mb-4">Are you sure you want to permanently delete <strong>"{{ product.title }}"</strong>? This action cannot be undone.</p>

                <form method="POST" action="">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'seller_dashboard' %}" class="btn btn-light border px-4">Cancel</a>
                        <button type="submit" class="btn btn-danger px-4 fw-semibold">Delete Listing</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
