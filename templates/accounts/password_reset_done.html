{% extends 'base.html' %}

{% block title %}Reset Link Sent — LocalHer{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="lh-card p-4 p-md-5 text-center">
                <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-3 text-success" style="width: 60px; height: 60px; background: #ECFDF5;">
                    <i class="fa-solid fa-paper-plane fs-3"></i>
                </div>
                <h3 class="fw-bold mb-2">Check Your Email</h3>
                <p class="text-muted small mb-4">We've emailed you instructions for setting your new password. If an account exists with that email, you will receive it shortly.</p>

                <a href="{% url 'login' %}" class="btn btn-lh-primary w-100 py-2 fw-semibold">
                    Return to Login Page
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
