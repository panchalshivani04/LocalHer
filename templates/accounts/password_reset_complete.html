{% extends 'base.html' %}

{% block title %}Password Reset Complete — LocalHer{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="lh-card p-4 p-md-5 text-center">
                <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-3 text-success" style="width: 60px; height: 60px; background: #ECFDF5;">
                    <i class="fa-solid fa-circle-check fs-3"></i>
                </div>
                <h3 class="fw-bold mb-2">Password Changed Successfully!</h3>
                <p class="text-muted small mb-4">Your password has been updated. You can now log in with your new password.</p>

                <a href="{% url 'login' %}" class="btn btn-lh-accent w-100 py-3 fw-bold">
                    Log In Now
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
