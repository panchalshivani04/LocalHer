{% extends 'base.html' %}

{% block title %}Log In — LocalHer{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="lh-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 54px; height: 54px; background: var(--lh-accent-soft); color: var(--lh-accent);">
                        <i class="fa-solid fa-lock fs-4"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Welcome Back</h3>
                    <p class="text-muted small">Log in to discover local sellers or manage your business</p>
                </div>

                <form method="POST" action="">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Enter your username" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                    </div>

                    <div class="d-flex align-items-center justify-content-between mb-4">
                        <div class="form-check">
                            <input type="checkbox" name="remember_me" id="rememberMe" class="form-check-input">
                            <label for="rememberMe" class="form-check-label small text-muted">Remember Me</label>
                        </div>
                        <a href="{% url 'password_reset' %}" class="small text-danger fw-semibold text-decoration-none">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn btn-lh-accent w-100 py-2 fw-semibold fs-6">
                        <i class="fa-solid fa-right-to-bracket me-2"></i> Log In
                    </button>
                </form>

                <hr class="my-4">

                <div class="text-center">
                    <p class="small text-muted mb-1">Don't have an account yet?</p>
                    <div class="d-flex justify-content-center gap-3 mt-2">
                        <a href="{% url 'register' %}" class="small text-danger fw-semibold text-decoration-none">Register as Customer</a>
                        <span class="text-muted">|</span>
                        <a href="{% url 'register_seller' %}" class="small text-primary fw-semibold text-decoration-none">Register as Seller</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
