{% extends 'base.html' %}

{% block title %}Reset Password — LocalHer{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="lh-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 54px; height: 54px; background: var(--lh-accent-soft); color: var(--lh-accent);">
                        <i class="fa-solid fa-key fs-4"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Reset Password</h3>
                    <p class="text-muted small">Enter your registered email address and we'll send you instructions to reset your password.</p>
                </div>

                <form method="POST" action="">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label fw-semibold small">Registered Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
                    </div>

                    <button type="submit" class="btn btn-lh-accent w-100 py-3 fw-bold fs-6">
                        Send Password Reset Link
                    </button>
                </form>

                <div class="text-center mt-4">
                    <a href="{% url 'login' %}" class="small text-muted fw-semibold text-decoration-none">
                        <i class="fa-solid fa-arrow-left me-1"></i> Back to Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
